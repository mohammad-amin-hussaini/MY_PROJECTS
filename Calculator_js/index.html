<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Calculator</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Tenor+Sans&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="calc">

  <div class="display">
    <span class="display__label">Aurum</span>
    <div class="display__expr"></div>
    <div class="display__value"></div>
  </div>

  <div class="keypad">

    <!-- Row 1 -->
    <div class="key key--mod">AC</div>
    <div class="key key--mod">C</div>
    <div class="key key--mod">%</div>
    <div class="key key--op">/</div>

    <!-- Row 2 -->
    <div class="key">7</div>
    <div class="key">8</div>
    <div class="key">9</div>
    <div class="key key--op">*</div>

    <!-- Row 3 -->
    <div class="key">4</div>
    <div class="key">5</div>
    <div class="key">6</div>
    <div class="key key--op">-</div>

    <!-- Row 4 -->
    <div class="key">1</div>
    <div class="key">2</div>
    <div class="key">3</div>
    <div class="key key--op">+</div>

    <!-- Row 5 -->
    <div class="key key--zero">0</div>
    <div class="key">.</div>
    <div class="key key--eq">=</div>

  </div>

  <div class="ornament">
    <div class="ornament__line"></div>
    <div class="ornament__mark"></div>
    <div class="ornament__line"></div>
  </div>

</div>

</body>
<script src="script.js"></script>
</html>
